[package]
name = "native_iroh_engine"
version = "0.2.0"
edition = "2021"

[lib]
name = "native_iroh_engine"
crate-type = ["cdylib"]

[dependencies]
iroh = { version = "1.1.0" }
tokio = { version = "1.38", features = ["rt-multi-thread", "sync", "macros", "time"] }

jni = "0.21.1"
futures-util = "0.3"
parking_lot = "0.12"
anyhow = "1.0"
bytes = "1"
serde_json = "1"
iroh-blobs = { version = "0.103.0", features = ["fs-store"] }
iroh-tickets = "1.0.0"
